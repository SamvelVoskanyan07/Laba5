<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Лабораторная работа №5 - Калькулятор</title>
    <!-- Подключаем внешний JS-файл с атрибутом defer -->
    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <h1>Калькулятор стоимости заказа</h1>
        <form id="order-form">
            <div>
                <label for="product">Выберите товар:</label>
                <select id="product">
                    <option value="500">Товар А — 500 руб.</option>
                    <option value="1200">Товар Б — 1200 руб.</option>
                    <option value="2500">Товар В — 2500 руб.</option>
                </select>
            </div>


            <div>
                <label for="quantity">Количество:</label>
                <input type="text" id="quantity" value="1">
            </div>


            <button type="button" id="calc-button">Подсчитать стоимость</button>
        </form>

        <h2 id="result"></h2>
        <p id="error" style="color: red; font-weight: bold;"></p>
    </main>
</body>
</html>
